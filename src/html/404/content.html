<section class="sect pt-0 pb-lg-70">
  <div class="container">

    <div class="row">
      <div class="col-xl-2"></div>
      <div class="col-xl-8">

        <div class="errorContent mb-3">
          <div class="errorBlock">

            <div class="max-w-380 max-w-xxl-300 mx-auto mx-xxl-unset">
              <h1 class="mb-2 mb-xxl-1">Страница не&nbsp;найдена</h1>
              <div class="fz-14 fz-md-12 color-grey60 max-w-380 max-w-md-180 position-relative z-2">

              </div>
            </div>
            <div class="errorTitle text-start text-xxl-center">

            </div>
          </div>
          <img class="errorImage" src="@img/admin/error/image-1.png" alt="image">
        </div>

        <div class="searchField d-flex position-relative w-100 bg--grey00 gap-12 p-2 mb-40">

          <button class="search-clear" type="button"><img src="@img/icons/search-clear.svg" alt="icon"></button>
          <button class="searchBtn button button--sm button--grey90 px-3 fz-12 fw-normal">

        </div>

        <div class="d-flex gap-2 flex-column flex-lg-row">
          <a href="#" class="button button--grey00 errorBtn flex-1">
            <svg class="w-24 h-24" style="fill: transparent; stroke: var(--grey90); stroke-width: 1.5px;">
              <use xlink:href="img/icons/icons.svg#home"></use>
            </svg>
            На главную
          </a>
          <a href="#" class="button button--grey00 errorBtn flex-1">
            <svg class="w-24 h-24" style="fill: transparent; stroke: var(--grey90); stroke-width: 1.5px;">
              <use xlink:href="img/icons/icons.svg#detail"></use>
            </svg>
            Каталог по типу детали
          </a>
          <a href="#" class="button button--grey00 errorBtn flex-1">
            <svg class="w-24 h-24" style="fill: transparent; stroke: var(--grey90); stroke-width: 1.5px;">
              <use xlink:href="img/icons/icons.svg#car"></use>
            </svg>

          </a>
        </div>

      </div>
      <div class="col-lg-2"></div>
